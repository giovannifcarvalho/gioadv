# Build do site, a cada alteração na branch main (também pode ser disparado à mão em
# Actions → "Build do site" → Run workflow):
#   1. gera o glossário, as listas de artigos, as trilhas de navegação e os dados estruturados;
#   2. recompila o CSS (assets/tailwind.css);
#   3. carimba a versão dos arquivos, atualiza o sitemap.xml e o versao.json;
#   4. salva o resultado na main (o Cloudflare Pages publica a partir dela);
#   5. espera a nova versão entrar no ar e limpa o cache do Cloudflare
#      (só se os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ZONE_ID estiverem cadastrados).
name: Build do site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-do-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          npm ci
          python -m pip install --quiet pillow

      - name: Gerar páginas, CSS e sitemap
        run: npm run build

      - name: Salvar alterações (se houver)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Atualiza arquivos gerados automaticamente"
            git push
          else
            echo "Nada mudou: os arquivos gerados já estavam atualizados."
          fi

      - name: Limpar o cache do Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SITE_URL: https://giovannidecarvalho.adv.br
        run: python3 scripts/limpar-cache.py
